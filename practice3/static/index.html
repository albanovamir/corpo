<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Загрузка файла</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&family=Rubik+Mono+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="top">
    <img src="pics/loopa-Photoroom.png" class="loopaIcon">
    <p class="topText">Practice 2</p>
  </div>
  
  <div class="headerDiv">
    <h1 class="header">Анализ текстовых файлов</h1>
    <h2 class="header2">Подсчет количества строк, слов и символов</h2>
  </div>
  
  <div class="buttonsDiv">
    <label for="fileInputLabel" class="fileInputLabel">Выберите файл</label>
    <input id="fileInputLabel" type="file" class="fileInput">
    <button class="uploadButton">Загрузить</button>  
  </div>

  <div class="resultDiv">
    <div class="rightDiv">
      <p class="string">Строки:</p>
      <p class="word">Слова:</p>
      <p class="symbol">Символы:</p>
    </div>
      
  </div>

  <img src="pics/cover_blog.png" class="backPic">

   <script>
        document.querySelector('.uploadButton').addEventListener('click', async function() {
            const fileInput = document.querySelector('input[type="file"]');
            const formData = new FormData();
            
            if (fileInput.files.length === 0) {
                alert('Please select a file first');
                return;
            }
            
            formData.append('file', fileInput.files[0]);
            
            try {
                const response = await fetch('/count', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                
                // Update the paragraphs with the results
                document.querySelector('.string').textContent = `Lines: ${data.lines}`;
                document.querySelector('.word').textContent = `Words: ${data.words}`;
                document.querySelector('.symbol').textContent = `Symbols: ${data.symbols}`;
                
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while processing the file');
            }
        });
    </script>
</body>
</html>
